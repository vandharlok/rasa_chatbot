#CANCELANDO CONSULTA//////////////////////////////////////////////////////////////////////////////////////////////
#CANCELANDO CONSULTA//////////////////////////////////////////////////////////////////////////////////////////////



- story: cancelando o cancelamento
  steps:
  - intent: cancelar_consulta
  - action: utter_cancelar_consulta
  - intent: negacao
  - action: utter_show_options
  - action: action_reset_all

 
#### terminado conversa

- story: Terminating Conversation with Feedback
  steps:
    - action: utter_terminar_conversa
    - intent: negacao
    - action: utter_final
    - intent: provide_feedback
      entities:
        - feedback
    - action: action_store_feedback


- story: User Continues Conversation
  steps:
    - action: utter_terminar_conversa
    - intent: concordancia
    - action: utter_show_options
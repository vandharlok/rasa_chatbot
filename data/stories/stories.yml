- story: Alterar o dia de uma consulta dps de perguntar algo (Happy path)
  steps:
  - intent: remarcar_consulta
  - action: utter_remarcar_consulta
  - intent: concordancia
  - action: modify_event_form
  - active_loop: modify_event_form
  - slot_was_set:
    - form_completed: true
    - requested_slot: null
  - active_loop: null
  - action: utter_confirm_appointment
  - intent: concordancia
  - action: action_modify_event_form
  - slot_was_set:
    - event_modify_completed: true
  - action: utter_terminar_conversa #conversa terminada por outra storie
  - intent: negacao
  - action: feedback_form
  - active_loop: feedback_form
  - active_loop: null
  - action: action_store_feedback


###  PATH TO REMARCANDO CONSULTA
- story: Falando o dia que quer e remarcando horario 
  steps:
  - intent: remarcar_consulta
  - action: utter_remarcar_consulta
  - intent: concordancia
  - action: modify_event_form
  - active_loop: modify_event_form
  - intent: perguntar_dias_livres
  - action: action_find_free_slots
  - slot_was_set: 
    - free_slots
  - active_loop: modify_event_form
  - slot_was_set:
    - form_completed: True
    - requested_slot: null
  - active_loop: null
  - action: utter_confirm_appointment
  - intent: concordancia
  - action: action_modify_event_form
  - slot_was_set:
    - event_modify_completed: True
  - action: utter_terminar_conversa
  - intent: negacao
  - action: feedback_form
  - active_loop: feedback_form
  - active_loop: null
  - action: action_store_feedback



- story: Nao remarcando consulta (SAD PATH)
  steps:
  - intent: remarcar_consulta
  - action: utter_remarcar_consulta
  - intent: negacao
  - action: utter_show_options
  - action: action_reset_all

  
